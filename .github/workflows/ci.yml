name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  verify:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Emit OpenAPI document
        run: npm run openapi:emit -- openapi.json

      - name: Validate OpenAPI document
        run: npm run openapi:validate

      - name: Validate MCP metadata
        run: npm run metadata:validate

      - name: Validate shell syntax
        run: bash -n scripts/*.sh scripts/bootstrap/*.sh

      - name: Verify deployment parameter resolution
        run: ./scripts/verify-parameter-resolution.sh

      - name: Upload OpenAPI document
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-tool-server-ebay-openapi
          path: openapi.json

  docker:
    name: Build container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: false
          load: true
          tags: agent-tool-server-ebay:ci
          build-args: |
            GIT_SHA=${{ github.sha }}

      - name: Smoke test the image
        env:
          API_KEY: ci-smoke-test-key-that-is-long-enough
          # Not a real credential: a throwaway value that satisfies eBay's documented 32-80
          # character alphanumeric/underscore/hyphen rule so the callback route mounts.
          DELETION_TOKEN: ci-smoke-test-verification-token-000000
          DELETION_ENDPOINT: https://connector.ci.invalid/ebay/notifications/marketplace-account-deletion
        run: |
          docker run -d --name connector -p 8080:8080 \
            -e API_KEYS="$API_KEY" \
            -e EBAY_CLIENT_ID=ci-placeholder-client-id \
            -e EBAY_CLIENT_SECRET=ci-placeholder-client-secret \
            -e EBAY_ACCOUNT_DELETION_ENDPOINT_URL="$DELETION_ENDPOINT" \
            -e EBAY_ACCOUNT_DELETION_VERIFICATION_TOKEN="$DELETION_TOKEN" \
            agent-tool-server-ebay:ci
          trap 'docker logs connector; docker rm -f connector' EXIT
          for _ in $(seq 1 20); do
            if curl -fsS http://localhost:8080/health > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8080/health
          curl -fsS http://localhost:8080/version
          curl -fsS http://localhost:8080/openapi.json > /dev/null
          curl -fsS -H "x-api-key: $API_KEY" http://localhost:8080/tools > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/tools)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/mcp)" = "401"
          test "$(docker inspect --format '{{.Config.User}}' connector)" = "node"

          # eBay's endpoint-validation challenge, computed independently of the connector.
          CHALLENGE=ci-challenge-code
          EXPECTED="$(printf '%s' "${CHALLENGE}${DELETION_TOKEN}${DELETION_ENDPOINT}" \
            | openssl dgst -sha256 -hex | awk '{print $NF}')"
          ACTUAL="$(curl -fsS \
            "http://localhost:8080/ebay/notifications/marketplace-account-deletion?challenge_code=${CHALLENGE}" \
            | jq -r .challengeResponse)"
          test "$ACTUAL" = "$EXPECTED"

          # The callback is public by design, but an unsigned notification must never be accepted.
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST -H 'content-type: application/json' -d '{}' \
            http://localhost:8080/ebay/notifications/marketplace-account-deletion)" = "400"

          # No connector secret may appear in the container's diagnostics.
          ! curl -fsS http://localhost:8080/version | grep -q "$DELETION_TOKEN"
          ! docker logs connector 2>&1 | grep -q "$DELETION_TOKEN"

  infra:
    name: Validate Bicep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build Bicep templates
        run: |
          az bicep install
          for template in infra/main.bicep infra/modules/*.bicep; do
            echo "Building $template"
            az bicep build --file "$template" --stdout > /dev/null
          done

      - name: Lint Bicep templates
        run: |
          for template in infra/main.bicep infra/modules/*.bicep; do
            echo "Linting $template"
            az bicep lint --file "$template"
          done
